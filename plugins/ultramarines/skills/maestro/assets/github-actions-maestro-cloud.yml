# GitHub Actions workflow for Maestro Cloud.
# Place at .github/workflows/maestro.yml in your app repo.
# Requires repo secret: MAESTRO_CLOUD_API_KEY

name: maestro

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android APK
        run: ./gradlew assembleDebug
        # adapt to your build system (Expo: eas build --profile preview --local)

      - name: Run Maestro Cloud (Android)
        uses: mobile-dev-inc/action-maestro-cloud@v2
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: app/build/outputs/apk/debug/app-debug.apk
          workspace: .maestro/flows
          include-tags: ci
          env: |
            BASE_URL=https://staging.example.com

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app for simulator
        run: |
          xcodebuild -workspace ios/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../app.app.zip App.app

      - name: Run Maestro Cloud (iOS)
        uses: mobile-dev-inc/action-maestro-cloud@v2
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: app.app.zip
          workspace: .maestro/flows
          include-tags: ci
          env: |
            BASE_URL=https://staging.example.com
